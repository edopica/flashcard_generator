[project]
name = "flashcard-generator"
version = "0.1.0"
description = "Script for generating flashcards from PDFs and syncing them to anki."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.108.2",
    "pdfplumber>=0.11.7",
    "genanki>=0.13.0",
    "requests>=2.32.5",
    "google-genai>=1.39.1",
]

[project.scripts]
generate_cards = 'main:main'
fgen = 'main:main'

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["src"]

[tool.setuptools.package-data]
"src" = ["math_prompt.md"]

[tool.uv]
package = true
